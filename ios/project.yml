name: Verba
options:
  bundleIdPrefix: com.agentik.verba
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: "975755H4ZC"
    SWIFT_VERSION: "5.0"
targets:
  VerbaApp:
    type: application
    platform: iOS
    sources: [VerbaApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentik.verba.ios
        INFOPLIST_FILE: VerbaApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: VerbaApp/VerbaApp.entitlements
    dependencies:
      - target: VerbaKeyboard
  VerbaKeyboard:
    type: app-extension
    platform: iOS
    sources: [VerbaKeyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentik.verba.ios.keyboard
        INFOPLIST_FILE: VerbaKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: VerbaKeyboard/VerbaKeyboard.entitlements
