name: Verify release (installs & launches)

# Proves a published release is actually consumable — on a real macOS runner, since the VPS is
# Linux. It checks BOTH things a user depends on:
#   1. the DMG installs and launches (signature, notarization, Gatekeeper, real launch), and
#   2. the auto-update feed works (appcast fetchable through /releases/latest/download/,
#      well-formed, advertising this version, with a resolvable enclosure).
# It also verifies the STABLE Verba.dmg asset — the one every website download button points at,
# which the versioned-DMG-only check used to skip entirely.
#
#   gh workflow run verify-release.yml --repo agentik-os/Verba -f version=0.9.95

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify (e.g. 0.9.95)"
        required: true
      expect_latest:
        description: "Assert this version is what /releases/latest/ serves (leave true for a just-cut release)"
        required: false
        type: boolean
        default: true

env:
  RELEASES_REPO: agentik-os/Verba-releases

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Read through env, never interpolated into a shell body (an input with a quote or `$(…)`
      # would otherwise be evaluated on the runner).
      - name: Validate version input
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION#v}"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$V' is not MAJOR.MINOR.PATCH (digits only, e.g. 0.9.98)."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Everything below hits the public URLs exactly as an end user and an installed Sparkle
      # client do — including the /releases/latest/download/ indirection, which is where a
      # mispublished release actually bites and which the versioned URL cannot detect.
      - name: The update feed is live and advertises this version
        env:
          V: ${{ steps.ver.outputs.version }}
          EXPECT_LATEST: ${{ github.event.inputs.expect_latest }}
        run: |
          set -euo pipefail
          # ── How this step reads the feed ───────────────────────────────────────────────
          # `generate_appcast` (Sparkle 2) emits the version as an ELEMENT inside <item>:
          #     <sparkle:version>0.9.98</sparkle:version>
          # Sparkle 1 put it on the enclosure instead (sparkle:version="0.9.98"), and the
          # app's own feed parser accepts both (Tests/UpdaterContractTests.swift). This step
          # used to `grep -q 'sparkle:version="$V"'`, which matches NOTHING against the feed
          # we actually publish: it failed on perfectly good releases and would have gone on
          # failing until someone read the XML. So parse the document with a real parser
          # rather than pattern-matching its serialization, and accept BOTH shapes so a
          # Sparkle up- or downgrade cannot blind this again. Same XPath and same two
          # backends as release.sh's appcast_facts — this asserts the same invariant on the
          # same file, after publication instead of before it.
          SPARKLE_NS='http://www.andymatuschak.org/xml-namespaces/sparkle'

          # appcast_nodes <label> <xpath> <file> — print `<label> <value>` per non-empty match.
          # string() of a single-node filter expression is that node's string-value, and
          # normalize-space strips the indentation generate_appcast wraps element content in.
          appcast_nodes() {
            local label="$1" xp="$2" file="$3" n i v
            n="$(xmllint --xpath "count($xp)" "$file" 2>/dev/null)" || return 1
            n="${n%%.*}"
            i=1
            while [ "$i" -le "$n" ]; do
              v="$(xmllint --xpath "normalize-space(string(($xp)[$i]))" "$file" 2>/dev/null)" || return 1
              if [ -n "$v" ]; then printf '%s %s\n' "$label" "$v"; fi
              i=$((i + 1))
            done
          }

          # appcast_facts <file> — print, one fact per line:
          #   items <count>        how many <item> entries the feed carries
          #   version <value>      once per sparkle:version, element form or attribute form
          #   signature <value>    once per sparkle:edSignature, element or attribute form
          #   enclosure <url>      once per <enclosure url="…">
          # Returns non-zero when the file cannot be parsed at all.
          appcast_facts() {
            local file="$1" xp_item xp_ver xp_sig xp_enc n
            xp_item="//*[local-name()='item']"
            xp_ver="//*[local-name()='version' and namespace-uri()='$SPARKLE_NS']"
            xp_ver="$xp_ver | //@*[local-name()='version' and namespace-uri()='$SPARKLE_NS']"
            xp_sig="//*[local-name()='edSignature' and namespace-uri()='$SPARKLE_NS']"
            xp_sig="$xp_sig | //@*[local-name()='edSignature' and namespace-uri()='$SPARKLE_NS']"
            xp_enc="//*[local-name()='enclosure']/@url"
            if command -v xmllint >/dev/null 2>&1; then
              n="$(xmllint --xpath "count($xp_item)" "$file" 2>/dev/null)" || return 1
              printf 'items %s\n' "${n%%.*}"
              appcast_nodes version   "$xp_ver" "$file" || return 1
              appcast_nodes signature "$xp_sig" "$file" || return 1
              appcast_nodes enclosure "$xp_enc" "$file" || return 1
            else
              # The heredoc body is deliberately flush with the YAML block indent so it reaches
              # python at column 0. Re-indenting it to match the shell around it breaks it.
              python3 - "$file" "$SPARKLE_NS" <<'PY' || return 1
          import sys, xml.etree.ElementTree as ET
          path, ns = sys.argv[1], sys.argv[2]
          nodes = list(ET.parse(path).getroot().iter())
          print("items %d" % sum(1 for e in nodes if e.tag.rsplit("}", 1)[-1] == "item"))
          for label, name in (("version", "version"), ("signature", "edSignature")):
              tag = "{%s}%s" % (ns, name)
              for e in nodes:
                  for raw in (e.text if e.tag == tag else None, e.attrib.get(tag)):
                      if raw and raw.strip():
                          print("%s %s" % (label, " ".join(raw.split())))
          for e in nodes:
              if e.tag.rsplit("}", 1)[-1] == "enclosure":
                  raw = e.attrib.get("url")
                  if raw and raw.strip():
                      print("enclosure %s" % raw.strip())
          PY
            fi
          }

          # Default (expect_latest=true) fetches through /releases/latest/, the exact indirection
          # SUFeedURL uses — the only path that catches a release published without becoming
          # 'latest'. Set it false to audit an older release through its own tag.
          if [ "${EXPECT_LATEST:-true}" = "false" ]; then
            BASE="https://github.com/$RELEASES_REPO/releases/download/v$V"
          else
            BASE="https://github.com/$RELEASES_REPO/releases/latest/download"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o appcast.xml "$BASE/appcast.xml"

          # Same backend choice as appcast_facts, so the fallback is a path that can actually
          # run rather than dead code behind an xmllint-only gate.
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout appcast.xml \
              || { echo "::error::published appcast.xml is not well-formed XML"; exit 1; }
          else
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' appcast.xml \
              || { echo "::error::published appcast.xml is not well-formed XML"; exit 1; }
          fi

          FACTS="$(appcast_facts appcast.xml)" \
            || { echo "::error::published appcast.xml could not be parsed for sparkle:version — either the XML is unreadable, or neither xmllint nor python3 is available on this runner"; exit 1; }
          ITEMS="" VERSIONS="" SIGS="" ENCS=""
          while read -r KIND VAL; do
            case "$KIND" in
              items)     ITEMS="$VAL" ;;
              version)   VERSIONS="$VERSIONS$VAL
          " ;;
              signature) SIGS="$SIGS$VAL
          " ;;
              enclosure) ENCS="$ENCS$VAL
          " ;;
            esac
          done <<< "$FACTS"

          # Exactly one <item>: release.sh gates the local appcast to a single item before it is
          # uploaded verbatim, so more than one here means the published feed is stale (a leftover
          # DMG in dist/ gets its own item, whose enclosure 404s under this release's tag).
          case "$ITEMS" in
            1) ;;
            0|"") echo "::error::published appcast carries no <item> — every client sees an empty feed"; exit 1 ;;
            *)    echo "::error::published appcast carries $ITEMS <item> entries; exactly one (v$V) is expected — the feed is stale"; exit 1 ;;
          esac

          DISTINCT="$(printf '%s' "$VERSIONS" | sed '/^[[:space:]]*$/d' | sort -u)"
          NDISTINCT=0
          if [ -n "$DISTINCT" ]; then NDISTINCT="$(printf '%s\n' "$DISTINCT" | wc -l | tr -d '[:space:]')"; fi
          if [ "$NDISTINCT" -eq 0 ]; then
            echo "::error::published appcast carries no sparkle:version (neither a <sparkle:version> element nor an enclosure attribute) — Sparkle cannot compare it against an installed build"
            exit 1
          fi
          if [ "$NDISTINCT" -gt 1 ]; then
            echo "::error::published appcast advertises conflicting sparkle:version values: $(printf '%s' "$DISTINCT" | tr '\n' ' ')"
            exit 1
          fi
          [ "$DISTINCT" = "$V" ] \
            || { echo "::error::published appcast advertises sparkle:version '$DISTINCT', expected '$V' (is 'latest' pointing elsewhere?)"; exit 1; }

          printf '%s' "$SIGS" | grep -q '[^[:space:]]' \
            || { echo "::error::published appcast carries no sparkle:edSignature — clients would reject the update"; exit 1; }

          ENC="$(printf '%s' "$ENCS" | sed '/^[[:space:]]*$/d' | head -1)"
          [ -n "$ENC" ] \
            || { echo "::error::published appcast carries no <enclosure url=…> — clients have nothing to download"; exit 1; }
          echo "enclosure: $ENC"
          curl -fsSL --retry 3 -o /dev/null "$ENC" \
            || { echo "::error::the appcast enclosure URL does not resolve: $ENC"; exit 1; }
          echo "✅ appcast live, well-formed, signed, one item advertising version $V, enclosure downloadable"

      - name: The website download link resolves to this version
        env:
          V: ${{ steps.ver.outputs.version }}
          EXPECT_LATEST: ${{ github.event.inputs.expect_latest }}
        run: |
          set -euo pipefail
          # Verba.dmg is the stable asset name behind /releases/latest/download/Verba.dmg, which
          # every download button on the site uses. Nothing verified it before.
          curl -fsSL --retry 3 -o verba-stable.dmg "$BASE/Verba.dmg"
          ls -lh verba-stable.dmg
          if [ "${EXPECT_LATEST:-true}" != "false" ]; then
            TAG=$(curl -fsSL "https://api.github.com/repos/$RELEASES_REPO/releases/latest" \
              | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
            [ "$TAG" = "v$V" ] \
              || { echo "::error::GitHub 'latest' on $RELEASES_REPO is '$TAG', not 'v$V' — the site serves the wrong build."; exit 1; }
            echo "✅ latest = $TAG, stable Verba.dmg downloadable"
          else
            echo "✅ stable Verba.dmg downloadable from v$V (latest-pointer check skipped)"
          fi

      - name: Download the published versioned DMG
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/$RELEASES_REPO/releases/download/v${V}/Verba-${V}.dmg"
          echo "Downloading $URL"
          curl -fL --retry 3 -o verba.dmg "$URL"
          ls -lh verba.dmg
          # The stable and versioned assets are copies of one build; if they differ, one of them
          # is stale and half the users get a different binary from the other half.
          if ! cmp -s verba.dmg verba-stable.dmg; then
            echo "::error::Verba.dmg and Verba-${V}.dmg differ — the stable asset is stale."
            exit 1
          fi
          echo "✅ stable and versioned DMGs are identical"

      - name: Mount the DMG
        id: mount
        run: |
          set -euo pipefail
          PLIST=$(hdiutil attach verba.dmg -nobrowse -plist)
          MNT=$(echo "$PLIST" | plutil -extract "system-entities" xml1 -o - - \
            | grep -A1 "mount-point" | grep string | sed -E 's/.*<string>(.*)<\/string>.*/\1/' | head -1)
          echo "Mounted at: $MNT"
          APP=$(ls -d "$MNT"/*.app | head -1)
          echo "App: $APP"
          echo "mount=$MNT" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # The version the user installs must be the version we claim to have released. Nothing
      # checked this before, so a bundle stamped with a different (or older) version could ship
      # and only surface as clients silently never updating.
      - name: The installed bundle carries the released version
        env:
          V: ${{ steps.ver.outputs.version }}
          APP: ${{ steps.mount.outputs.app }}
        run: |
          set -euo pipefail
          for KEY in CFBundleVersion CFBundleShortVersionString; do
            GOT=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Contents/Info.plist")
            echo "$KEY = $GOT"
            [ "$GOT" = "$V" ] || { echo "::error::$KEY is '$GOT', expected '$V'"; exit 1; }
          done
          FEED=$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP/Contents/Info.plist")
          KEYED=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP/Contents/Info.plist")
          echo "SUFeedURL = $FEED"
          [ -n "$KEYED" ] || { echo "::error::shipped bundle has no SUPublicEDKey — it can never accept an update"; exit 1; }
          curl -fsSL --retry 3 -o /dev/null "$FEED" \
            || { echo "::error::the SUFeedURL baked into the shipped app does not resolve: $FEED"; exit 1; }
          echo "✅ bundle is v$V and its own feed URL resolves"

      - name: Code signature is valid and issued to our Developer ID
        env:
          APP: ${{ steps.mount.outputs.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- identity ---"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier" | head
          # Assert the authority, don't just print it: an ad-hoc or third-party signature would
          # otherwise pass this step silently.
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::app is not signed by a 'Developer ID Application' authority"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -q "TeamIdentifier=975755H4ZC" \
            || { echo "::error::app is not signed by team 975755H4ZC"; exit 1; }

      - name: Notarization ticket is stapled to the DMG
        run: |
          set -euo pipefail
          # HARD gate: the DMG is what users download, and sign-and-notarize.sh staples it with no
          # `|| true`, so this must hold.
          xcrun stapler validate verba.dmg \
            || { echo "::error::the published DMG has no stapled notarization ticket"; exit 1; }
          echo "✅ DMG stapled"

      - name: Notarization ticket on the inner .app (known gap — reported, not fatal)
        env:
          APP: ${{ steps.mount.outputs.app }}
        run: |
          set -euo pipefail
          # The .app inside the DMG is snapshotted into the image BEFORE `stapler staple` runs on
          # it (make-dmg.sh copies the app, then sign-and-notarize.sh staples the local copy), so
          # the shipped app is unstapled and its first launch needs an ONLINE Gatekeeper check.
          # Fixing that needs a two-pass notarization in sign-and-notarize.sh, which is outside
          # this workflow. Report it loudly rather than pretend it passed.
          if xcrun stapler validate "$APP"; then
            echo "✅ inner .app is stapled"
          else
            echo "::warning::the .app inside the DMG is NOT stapled — offline first launch will be blocked by Gatekeeper. Fix: staple the app before building the DMG (two-pass notarization in sign-and-notarize.sh)."
          fi

      - name: Gatekeeper accepts it (would launch on a user's Mac)
        env:
          APP: ${{ steps.mount.outputs.app }}
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Install to /Applications like a user
        id: install
        env:
          APP: ${{ steps.mount.outputs.app }}
          MNT: ${{ steps.mount.outputs.mount }}
        run: |
          set -euo pipefail
          cp -R "$APP" /Applications/
          APPNAME=$(basename "$APP")
          echo "installed=/Applications/$APPNAME" >> "$GITHUB_OUTPUT"
          hdiutil detach "$MNT" || true

      - name: Launch it and confirm the process runs
        env:
          INSTALLED: ${{ steps.install.outputs.installed }}
        run: |
          set -euo pipefail
          open "$INSTALLED"
          echo "Waiting for com.agentik.verba to come up…"
          for i in $(seq 1 20); do
            if pgrep -f "/Applications/.*Verba.app/Contents/MacOS/Verba" >/dev/null; then
              echo "✅ Verba is running (pid $(pgrep -f 'Verba.app/Contents/MacOS/Verba' | head -1))"
              sleep 3
              # Still alive after a few seconds = it did not crash on launch.
              if pgrep -f "Verba.app/Contents/MacOS/Verba" >/dev/null; then
                echo "✅ Still alive after 3s — clean launch, no immediate crash."
                osascript -e 'quit app "Verba"' 2>/dev/null || killall Verba 2>/dev/null || true
                exit 0
              fi
              echo "::error::Verba started but exited within 3s (launch crash)."
              exit 1
            fi
            sleep 1
          done
          echo "::error::Verba never appeared as a running process after 20s."
          # Surface any crash report for diagnosis.
          ls -t ~/Library/Logs/DiagnosticReports/*.crash ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1 | xargs -I{} sh -c 'echo "--- {} ---"; cat "{}"' || true
          exit 1
