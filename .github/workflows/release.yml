name: Release (macOS desktop)

# Build, sign, notarize and publish the Verba macOS app entirely on a GitHub-hosted macOS
# runner — no local Mac needed. Trigger it from anywhere (your VPS) by pushing a version tag:
#
#   git tag v0.9.94 && git push origin v0.9.94
#
# It reproduces ./release.sh (swift build → bundle → codesign → notarize → Sparkle appcast →
# GitHub release on agentik-os/Verba-releases). Required repo Secrets are documented in
# docs/CI-SETUP.md. macOS/iOS builds CANNOT run on Linux — this is the cloud-macOS path.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.9.94) — omit to use the pushed tag"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS 26 (Tahoe) runner — Xcode 26 ships the macOS 26 SDK the app compiles against (it uses the
    # Liquid Glass APIs: glassEffect / GlassEffectContainer / .buttonStyle(.glass)). Older runners
    # (macos-15 = Xcode 16 = macOS 15 SDK) lack those symbols and fail to build.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag or input
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Select newest Xcode 26 (macOS 26 SDK)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          swift --version
          xcrun --show-sdk-version

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          # Make our keychain the default + first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key (for notarization)
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Write Sparkle EdDSA private key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private.key"

      - name: Fetch the bundled Parakeet model (Git LFS from Hugging Face)
        run: |
          set -euo pipefail
          git lfs version || brew install git-lfs
          git lfs install
          # The HF repo carries EVERY Parakeet variant (~3 GB → a 4.6 GB app bundle → a DMG over
          # GitHub's 2 GB per-asset limit → 422 on upload). HF's git backend doesn't support partial
          # clone, so clone the whole thing (transient on the runner) but copy ONLY the v3 files the
          # app actually loads into PARAKEET_SRC (matches the local ~461 MB model) — that's what
          # bundle.sh embeds, so the DMG stays small.
          git clone --depth 1 https://huggingface.co/FluidInference/parakeet-tdt-0.6b-v3-coreml "$RUNNER_TEMP/hf"
          DST="$RUNNER_TEMP/parakeet"; mkdir -p "$DST"
          cd "$RUNNER_TEMP/hf"
          cp -R config.json parakeet_v3_vocab.json parakeet_vocab.json \
                Decoder.mlmodelc Encoder.mlmodelc JointDecisionv3.mlmodelc Preprocessor.mlmodelc "$DST/"
          echo "v3 model size (should be ~0.5 GB):"; du -sh "$DST"; ls "$DST"

      - name: Build, sign, notarize + publish release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEVID: ${{ secrets.APPLE_DEVID }}
          NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle_ed_private.key
          PARAKEET_SRC: ${{ runner.temp }}/parakeet
          # gh release create targets the PUBLIC agentik-os/Verba-releases repo → needs a PAT with
          # write access to it (the default GITHUB_TOKEN is scoped to this source repo only).
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          ./release.sh

      - name: Cleanup secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle_ed_private.key" || true
